<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>More Bounce Labs</title>
  <meta name="description" content="More Bounce Labs. Winamp-style album player for Mikey More Bounce." />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg class="mbl-logo" viewBox="0 0 220 54" aria-label="MBL">
          <defs>
            <linearGradient id="mblg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7CFF4A"/>
              <stop offset="0.45" stop-color="#1EE6FF"/>
              <stop offset="1" stop-color="#2F6BFF"/>
            </linearGradient>
          </defs>
          <text x="4" y="42" fill="url(#mblg)" stroke="#041018" stroke-width="2">MBL</text>
        </svg>
        <div class="sub" id="tagline">MORE BOUNCE LABS</div>
      </div>
      <div class="top-actions">
        <input id="search" class="search" type="search" placeholder="Search albums or tracks" />
        <button class="btn ghost" id="import-btn" type="button">Import</button>
        <button class="btn ghost" id="export-btn" type="button">Export</button>
        <button class="btn hot" id="suno-btn" type="button">From Suno</button>
        <button class="btn solid" id="add-btn" type="button">New album</button>
        <input id="import-file" class="hidden" type="file" accept="application/json" />
      </div>
    </header>
    <main class="stage" id="stage"></main>
    <section class="vis-window">
      <div class="kicker"><h1>VISUALIZER</h1><p>MILKDROP MODE</p></div>
      <canvas id="viz" width="1100" height="180"></canvas>
    </section>
    <footer class="player" id="player"></footer>
  </div>
  <div id="modal" class="hidden"></div>
  <audio id="audio" preload="metadata"></audio>
  <script src="app.js"></script>
</body>
</html>
