<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MicTek House · Albums</title>
  <meta name="description" content="Mikey More Bounce album house. Playable outside Suno." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="mark">MIC<span>TEK</span></div>
        <div class="sub" id="tagline">Mikey More Bounce</div>
      </div>
      <div class="top-actions">
        <input id="search" class="search" type="search" placeholder="Search albums or tracks" />
        <button class="btn ghost" id="import-btn" type="button">Import</button>
        <button class="btn ghost" id="export-btn" type="button">Export</button>
        <button class="btn hot" id="suno-btn" type="button">From Suno</button>
        <button class="btn solid" id="add-btn" type="button">New album</button>
        <input id="import-file" class="hidden" type="file" accept="application/json" />
      </div>
    </header>
    <main class="stage" id="stage"></main>
    <footer class="player" id="player"></footer>
  </div>
  <div id="modal" class="hidden"></div>
  <audio id="audio" preload="metadata"></audio>
  <script src="app.js"></script>
</body>
</html>
